org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
# Redaction: these Ktor internals log upstream URLs (v3 account calls carry session_id in the query) and
# rate-limit keys (session cookie values) at debug/trace. They stay at info even if the default level is lowered.
org.slf4j.simpleLogger.log.io.ktor.client=info
org.slf4j.simpleLogger.log.io.ktor.server.plugins.ratelimit=info
